kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pod-killer
rules:
  # The kicker deletes its own Pod as a last resort when Calico's WireGuard addresses never appear.
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - delete
  # The kicker first runs Calico's one-shot tunnel address allocator inside the calico-node container of its own Pod.
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-killer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-killer
subjects:
  - kind: ServiceAccount
    name: calico-node
